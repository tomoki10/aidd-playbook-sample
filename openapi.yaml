openapi: 3.0.3
info:
  title: 備品貸出 API
  version: 0.1.0
  description: |
    社内備品の貸出を管理する API。
    認証は `Authorization: Bearer <token>`（研修では利用者 ID がトークン）。
    components.schemas を変更したら `npm run generate` で src/generated/types.ts を作り直す。
paths:
  /items:
    get:
      summary: 備品の一覧（認証不要）。種類と、いま借りられるかで絞り込める
      parameters:
        - name: category
          in: query
          required: false
          description: 備品の種類で絞り込む
          schema:
            $ref: "#/components/schemas/ItemCategory"
        - name: available
          in: query
          required: false
          description: true ならいま借りられる備品だけ、false なら貸出中の備品だけを返す。返却されていない貸出があれば、返却期限を過ぎていても貸出中
          schema:
            type: boolean
      responses:
        "200":
          description: 備品の一覧。借り手の情報は含めない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemList"
        "400":
          description: クエリの値が不正（未知の category、true / false 以外の available）
  /loans:
    post:
      summary: 備品を借りる（借り手はログイン中の利用者）
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanRequest"
      responses:
        "201":
          description: 貸出を作成した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEnvelope"
        "400":
          description: 入力が不正
        "401":
          description: 未認証
        "404":
          description: 備品が存在しない
        "409":
          description: 備品が貸出中
  /loans/me:
    get:
      summary: 自分の貸出の一覧（ログイン中の利用者の、返却していない貸出）
      security:
        - bearer: []
      responses:
        "200":
          description: 自分の貸出中の備品と返却期限。返却期限の早い順
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyLoanList"
        "401":
          description: 未認証
  /loans/{id}/return:
    post:
      summary: 貸出を返却する（借り手本人または管理者）
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返却した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEnvelope"
        "401":
          description: 未認証
        "404":
          description: 貸出が存在しない、または本人の貸出ではない
        "409":
          description: 返却済み
  /loans/{id}/extend:
    post:
      summary: 貸出を延長する（借り手本人のみ。1回まで、7日）
      security:
        - bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 延長した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoanEnvelope"
        "401":
          description: 未認証
        "404":
          description: 貸出が存在しない、または本人の貸出ではない
        "409":
          description: 返却済み、期限超過、または延長の上限に達した
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    ItemCategory:
      description: 備品の種類
      type: string
      enum: [pc, monitor, camera, projector, other]
    Item:
      type: object
      required: [id, name, category, available]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: "#/components/schemas/ItemCategory"
        available:
          type: boolean
    ItemList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Item"
    BorrowerSummary:
      description: API で返す借り手の情報。email と phone は含めない
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    Loan:
      type: object
      required: [id, itemId, borrower, loanedAt, dueDate, returnedAt, extensionCount]
      properties:
        id:
          type: string
        itemId:
          type: string
        borrower:
          $ref: "#/components/schemas/BorrowerSummary"
        loanedAt:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        returnedAt:
          type: string
          format: date
          nullable: true
        extensionCount:
          type: integer
    LoanEnvelope:
      type: object
      required: [loan]
      properties:
        loan:
          $ref: "#/components/schemas/Loan"
    MyLoan:
      description: 自分の貸出。借り手は本人なので、借り手の情報は含めない
      type: object
      required: [id, itemId, itemName, loanedAt, dueDate, extensionCount]
      properties:
        id:
          type: string
        itemId:
          type: string
        itemName:
          type: string
        loanedAt:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        extensionCount:
          type: integer
    MyLoanList:
      type: object
      required: [loans]
      properties:
        loans:
          type: array
          items:
            $ref: "#/components/schemas/MyLoan"
    CreateLoanRequest:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
